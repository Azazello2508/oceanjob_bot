name: Проверка вакансий

on:
  schedule:
    # каждые 45 минут: 00:07, 00:52, 01:37, 02:22, 03:07 … (UTC)
    - cron: "7,52 0-21/3 * * *"
    - cron: "37 1-22/3 * * *"
    - cron: "22 2-23/3 * * *"
  workflow_dispatch:        # кнопка ручного запуска

permissions:
  contents: write           # чтобы сохранять seen.json

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Проверить вакансии
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Запомнить отправленные
        run: |
          git config user.name "oceanjob-bot"
          git config user.email "oceanjob-bot@users.noreply.github.com"
          git add seen.json day.json
          git diff --cached --quiet || git commit -m "Обновить список вакансий"
          # Если за время проверки в репозиторий что-то добавили — подтянуть и повторить
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && break
            sleep 5
          done
