<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отклик на вакансию</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 20px 16px; background: #f4f6f8; color: #1d2733; }
  .box { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  h1 { font-size: 18px; margin: 0 0 12px; }
  a.btn { display: block; text-align: center; background: #d93025; color: #fff; text-decoration: none; padding: 14px; border-radius: 10px; font-size: 17px; margin: 14px 0; }
  .muted { color: #6b7785; font-size: 14px; }
  pre { white-space: pre-wrap; background: #f4f6f8; padding: 12px; border-radius: 8px; font-size: 14px; }
  button { width: 100%; padding: 12px; border: 1px solid #c9d2dc; border-radius: 10px; background: #fff; font-size: 15px; margin-top: 6px; }
</style>
</head>
<body>
<div class="box">
  <h1>📧 Отклик на вакансию</h1>
  <div class="muted">Кому: <b id="to"></b><br>Тема: <span id="su"></span></div>
  <a class="btn" id="go" href="#">Открыть письмо в Gmail</a>
  <div class="muted">Если Gmail не открылся с готовым письмом — скопируйте адрес, тему и текст:</div>
  <button id="c_to">Скопировать адрес</button>
  <button id="c_su">Скопировать тему</button>
  <button id="c_body">Скопировать текст письма</button>
  <pre id="body"></pre>
</div>
<script>
  var p = new URLSearchParams(location.search);
  var to = p.get("to") || "", r = p.get("r") || "Officer", v = p.get("v") || "";
  // Тема и текст письма (шаблон — тот же, что в letter.txt)
  var su = p.get("su") || ("Application for " + r + (v ? " – " + v : ""));
  var body = p.get("body") || ("Good day!\n\nI would like to apply for the " + r + " position on " +
    (v || "your vessel") + ".\n\nPlease find my CV attached. I am ready to provide any additional documents " +
    "and to discuss the details at your convenience.\n\nBest regards,");
  document.getElementById("to").textContent = to;
  document.getElementById("su").textContent = su;
  document.getElementById("body").textContent = body;
  var q = "to=" + encodeURIComponent(to) + "&subject=" + encodeURIComponent(su) + "&body=" + encodeURIComponent(body);
  var ua = navigator.userAgent;
  var link;
  if (/iPhone|iPad|iPod/i.test(ua)) {
    link = "googlegmail://co?" + q;                       // приложение Gmail на iPhone
  } else if (/Android/i.test(ua)) {
    link = "mailto:" + to + "?" + q.replace(/^to=[^&]*&/, "");  // на Android откроется Gmail (почта по умолчанию)
  } else {
    link = "https://mail.google.com/mail/?view=cm&fs=1&" + q.replace("subject=", "su=");  // компьютер
  }
  document.getElementById("go").href = link;
  function copy(id, text) {
    navigator.clipboard.writeText(text).then(function () { document.getElementById(id).textContent = "Скопировано ✓"; });
  }
  document.getElementById("c_to").onclick = function () { copy("c_to", to); };
  document.getElementById("c_su").onclick = function () { copy("c_su", su); };
  document.getElementById("c_body").onclick = function () { copy("c_body", body); };
  setTimeout(function () { location.href = link; }, 300);
</script>
</body>
</html>
