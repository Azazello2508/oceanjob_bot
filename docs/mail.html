<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отклик на вакансию</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 20px 16px; background: #f4f6f8; color: #1d2733; }
  .box { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  h1 { font-size: 18px; margin: 0 0 12px; }
  a.btn { display: block; text-align: center; background: #2a7ae2; color: #fff; text-decoration: none; padding: 14px; border-radius: 10px; font-size: 17px; margin: 14px 0; }
  .muted { color: #6b7785; font-size: 14px; }
  pre { white-space: pre-wrap; background: #f4f6f8; padding: 12px; border-radius: 8px; font-size: 14px; }
  button { width: 100%; padding: 12px; border: 1px solid #c9d2dc; border-radius: 10px; background: #fff; font-size: 15px; }
</style>
</head>
<body>
<div class="box">
  <h1>📧 Отклик на вакансию</h1>
  <div class="muted">Кому: <b id="to"></b><br>Тема: <span id="su"></span></div>
  <a class="btn" id="go" href="#">Открыть в почте</a>
  <div class="muted">Если почта не открылась — скопируйте текст и адрес вручную:</div>
  <pre id="body"></pre>
  <button id="copy">Скопировать текст письма</button>
</div>
<script>
  var p = new URLSearchParams(location.search);
  var to = p.get("to") || "", su = p.get("su") || "", body = p.get("body") || "";
  document.getElementById("to").textContent = to;
  document.getElementById("su").textContent = su;
  document.getElementById("body").textContent = body;
  var mailto = "mailto:" + to + "?subject=" + encodeURIComponent(su) + "&body=" + encodeURIComponent(body);
  document.getElementById("go").href = mailto;
  document.getElementById("copy").onclick = function () {
    navigator.clipboard.writeText(body).then(function () { document.getElementById("copy").textContent = "Скопировано ✓"; });
  };
  location.href = mailto;  // сразу открыть почтовое приложение
</script>
</body>
</html>
